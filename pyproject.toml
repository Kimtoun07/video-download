[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grabvid"
version = "1.0.0"
description = "Universal Video Downloader — 1000+ platforms, CLI & GUI, cross-platform"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "GrabVid Contributors"},
]
keywords = ["video", "downloader", "youtube", "bilibili", "tiktok", "cli", "gui"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Internet :: WWW/HTTP",
]

dependencies = [
    "yt-dlp>=2024.0",
    "click>=8.0",
]

[project.optional-dependencies]
gui = [
    "customtkinter>=5.0",
    "Pillow>=9.0",
]
all = [
    "customtkinter>=5.0",
    "Pillow>=9.0",
    "pyperclip>=1.8",
    "mutagen>=1.45",
    "requests>=2.28",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[project.scripts]
grabvid = "src.cli.main:main"

[project.gui-scripts]
grabvid-gui = "src.gui.app:main"

[project.urls]
Homepage = "https://github.com/Kimtoun07/video-download"
Repository = "https://github.com/Kimtoun07/video-download"
Issues = "https://github.com/Kimtoun07/video-download/issues"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.black]
line-length = 100
target-version = ["py38"]

[tool.ruff]
line-length = 100
target-version = "py38"
